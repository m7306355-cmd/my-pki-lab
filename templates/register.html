<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>用户注册 - Melissa PKI Lab</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; }
.box { background: white; border-radius: 10px; padding: 40px; width: 380px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
.box h2 { text-align: center; color: #2c3e50; margin-bottom: 8px; font-size: 22px; }
.box p { text-align: center; color: #888; font-size: 13px; margin-bottom: 28px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
.form-group input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; outline: none; }
.form-group input:focus { border-color: #3498db; }
.btn { width: 100%; padding: 12px; background: #2c3e50; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 8px; }
.btn:hover { background: #3498db; }
.error { background: #fdecea; color: #e74c3c; padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; }
.links { display: flex; justify-content: space-between; margin-top: 16px; }
.links a { font-size: 13px; color: #888; text-decoration: none; }
.links a:hover { color: #3498db; }
</style>
</head>
<body>
<div class="box">
  <h2>用户注册</h2>
  <p>注册后可申请 PKI 证书</p>
  {% if error %}
  <div class="error">{{ error }}</div>
  {% endif %}
  <form method="POST">
    <div class="form-group">
      <label>用户名</label>
      <input type="text" name="username" placeholder="请输入用户名" required>
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" name="password" placeholder="请输入密码" required>
    </div>
    <div class="form-group">
      <label>组织名称（可选）</label>
      <input type="text" name="org" placeholder="例如：Melissa PKI Lab">
    </div>
    <button type="submit" class="btn">注册</button>
  </form>
  <div class="links">
    <a href="/">← 返回首页</a>
    <a href="/user_login">已有账号？登录</a>
  </div>
</div>
</body>
</html>
